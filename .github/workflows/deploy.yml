name: Deploy production

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy backend and Worker to production
        required: true
        type: choice
        options: [production]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    # Disabled until an owner configures and verifies environment protection.
    # See docs/deployment.md. Enabling this requires a separate reviewed change.
    if: ${{ false && github.ref == 'refs/heads/main' && inputs.target == 'production' }}
    needs: validate
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate production target and required settings
        run: node scripts/validate-deploy-env.mjs
        env:
          CONVEX_DEPLOYMENT_NAME: ${{ vars.CONVEX_DEPLOYMENT_NAME }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
          SECRET_BINDING_TOKEN: ${{ secrets.SECRET_BINDING_TOKEN }}
      - name: Deploy Convex production backend
        run: pnpm exec convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - name: Build app against deployed backend
        run: pnpm build
      - name: Validate Worker output
        run: pnpm exec cf deploy --prebuilt --mode production --worker dfe --dry-run
      - name: Deploy Worker with runtime secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKOS_CLIENT_ID: ${{ secrets.WORKOS_CLIENT_ID }}
          WORKOS_API_KEY: ${{ secrets.WORKOS_API_KEY }}
          WORKOS_COOKIE_PASSWORD: ${{ secrets.WORKOS_COOKIE_PASSWORD }}
          WORKOS_REDIRECT_URI: ${{ secrets.WORKOS_REDIRECT_URI }}
          SECRET_BINDING_TOKEN: ${{ secrets.SECRET_BINDING_TOKEN }}
        shell: bash
        run: |
          secret_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secret_file"' EXIT
          node --input-type=module - "$secret_file" <<'JS'
          import { writeFileSync } from "node:fs"
          const names = ["WORKOS_CLIENT_ID", "WORKOS_API_KEY", "WORKOS_COOKIE_PASSWORD", "WORKOS_REDIRECT_URI", "SECRET_BINDING_TOKEN"]
          writeFileSync(process.argv[2], JSON.stringify(Object.fromEntries(names.map(name => [name, process.env[name]]))), { mode: 0o600 })
          JS
          pnpm exec cf deploy --prebuilt --mode production --worker dfe --provision=false --secrets-file "$secret_file"
