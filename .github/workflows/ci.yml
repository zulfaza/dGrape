name: CI

on:
  pull_request:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check changed source formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' '*.json' '*.jsonc' ':!convex/_generated/**')
          if (( ${#files[@]} )); then
            pnpm exec oxfmt --check "${files[@]}"
          fi
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:backend
      - run: pnpm typecheck:design-system
      - run: pnpm design-system:build
      - run: pnpm build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
          VITE_CONVEX_SITE_URL: https://example.convex.site
      - run: pnpm exec cf deploy --prebuilt --mode production --worker dfe --dry-run
